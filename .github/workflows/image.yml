# Build and publish the image, and publish only after the tests pass.
#
# `check` is deliberately the same commands `make check` runs, so a green local
# tree and a green build mean the same thing. `image` builds and pushes, and
# only on a push to a main branch or a tag — a pull request runs `check` alone.
#
# A push runs all of this itself; `workflow_dispatch` is the same run started
# by hand, so a deployment can be redone without an empty commit.
#
# It needs two repository secrets from Docker Hub (Account settings → Personal
# access tokens, with Read & write — never the account password):
#
#   DOCKERHUB_USERNAME   the account name
#   DOCKERHUB_TOKEN      the access token
#
# Nothing here echoes either one.
name: image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: test with the race detector
        run: make test-race
      - name: build
        run: make build

  # One buildx build produces the manifest list: it builds linux/amd64 and
  # linux/arm64 and joins them under each tag itself, so a pull on either
  # architecture gets a native image. That is the whole job — there is no
  # per-architecture build to stitch together afterwards.
  image:
    # A pull request has no credentials and nothing to publish. It runs `check`,
    # which is the part that judges the change.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe reads the tags, and a shallow clone has none.
          fetch-depth: 0

      # QEMU is what lets the arm64 build run on this amd64 runner. The
      # Dockerfile's builder is pinned to $BUILDPLATFORM and cross-compiles, so
      # the Go build is native and only the base image is emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: version
        id: v
        run: |
          # The Makefile's own answer, so an image built here and one built
          # locally report the same version.
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ github.repository_owner }}/labs:latest
            docker.io/${{ github.repository_owner }}/labs:${{ steps.v.outputs.version }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every push leaves the previous version's tags behind, and Docker Hub has
      # no retention setting on any plan — its own docs describe deleting tags by
      # hand and nothing else. So each push removes the ones it made stale, after
      # the new image is up so the repository is never left without a good one.
      # `latest` is never a candidate; see the script.
      - name: prune the older tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: hack/prune-dockerhub-tags.sh "${{ github.repository_owner }}/labs" 3
