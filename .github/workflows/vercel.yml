# Deploy the Vercel project, and deploy only after the tests pass.
#
# Pushing to a main branch deploys, and this is the only thing that does:
# Vercel's own git integration is switched off in vercel.json, so a push does
# not deploy twice — once by Vercel and once here. The build runs in this
# runner (`vercel build`) and only the output is uploaded, so the source is not
# sent to Vercel to be built there.
#
# A push runs this itself; `workflow_dispatch` is the same run started by hand,
# so a deployment can be redone without an empty commit.
#
# It needs three repository secrets, all from Vercel:
#
#   VERCEL_TOKEN        vercel.com/account/tokens
#   VERCEL_ORG_ID       from `vercel link`, in .vercel/project.json
#   VERCEL_PROJECT_ID   the same file
#
# The service's own settings — GITHUB_TOKEN and the rest — are read from
# the Vercel project's environment variables at runtime, not from here, so
# they are set in the Vercel dashboard rather than in this repository.
name: vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: test with the race detector
        run: make test-race
      - name: build
        run: make build

  vercel:
    # A deployment is worth nothing if the tests do not pass.
    needs: check
    # A push to a main branch deploys; so does a hand-started run, which is
    # still on the branch it was started from. Any other push — a side branch —
    # runs `check` alone.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Through the environment rather than a --token argument, so the token does
    # not appear in the command line the runner logs.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: install the Vercel CLI
        run: npm install --global vercel@latest
      # The project settings and environment variables have to be present before
      # the build; `vercel build` reads them from what this writes.
      - name: pull the project settings
        run: vercel pull --yes --environment=production
      - name: build
        run: vercel build --prod
      - name: deploy
        run: vercel deploy --prebuilt --prod
